- sensor:
    - name: "Beaufort Scale"
      unique_id: beaufort_scale
      state: >
        {% set wind_speed = states('sensor.st_00187689_wind_speed') | float(0) %}
        {% set bft = (wind_speed / 1.496) ** (2/3) %}
        {% set bft = [0, [bft, 12] | min] | max | round(0) | int %}
        {% set descriptions = ["Calm", "Light Air", "Light Breeze", "Gentle Breeze", "Moderate Breeze", "Fresh Breeze", "Strong Breeze", "Near Gale", "Gale", "Strong Gale", "Storm", "Violent Storm", "Hurricane"] %}
        {{ descriptions[bft] }}

      attributes:
        number: >
          {% set wind_speed = states('sensor.st_00187689_wind_speed') | float(0) %}
          {% set bft = (wind_speed / 1.496) ** (2/3) %}
          {{ [0, [bft, 12] | min] | max | round(0) | int}}

        land: >
          {% set wind_speed = states('sensor.st_00187689_wind_speed') | float(0) %}
          {% set bft = (wind_speed / 1.496) ** (2/3) %}
          {% set bft = [0, [bft, 12] | min] | max | round(0) | int %}
          {% set descriptions = [
            "Smoke rises vertically.",
            "Direction shown by smoke drift.",
            "Wind felt on face; leaves rustle.",
            "Leaves and small twigs in constant motion.",
            "Raises dust and loose paper; small branches move.",
            "Small trees in leaf start to sway.",
            "Large branches in motion; whistling in wires.",
            "Whole trees in motion; walking against wind difficult.",
            "Twigs break from trees; walking difficult.",
            "Slight structural damage; chimney pots removed.",
            "Trees uprooted; considerable structural damage.",
            "Widespread damage.",
            "Devastation."
          ] %}
          {{ descriptions[bft] }}

        sea: >
          {% set wind_speed = states('sensor.st_00187689_wind_speed') | float(0) %}
          {% set bft = (wind_speed / 1.496) ** (2/3) %}
          {% set bft = [0, [bft, 12] | min] | max | round(0) | int %}
          {% set descriptions = [
            "Sea like a mirror.",
            "Ripples with appearance of scales.",
            "Small wavelets; crests glassy.",
            "Large wavelets; crests begin to break.",
            "Small waves; frequent white horses.",
            "Moderate waves; many white horses.",
            "Large waves; extensive foam crests.",
            "Sea heaps up; foam in streaks.",
            "Moderately high waves; spindrift.",
            "High waves; dense foam; visibility affected.",
            "Very high waves; sea white with foam.",
            "Exceptionally high waves; visibility affected.",
            "Air filled with foam; visibility seriously affected."
          ] %}
          {{ descriptions[bft] }}
