- trigger:
    - trigger: time_pattern
      minutes: "/30"
    - trigger: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      data:
        type: hourly
      target:
        entity_id: >
          {% set is_work = is_state('binary_sensor.workday_sensor', 'on') and 7 <= now().hour < 17 %}
          {{ 'weather.om_work' if is_work else 'weather.om_home' }}
      response_variable: hourly
  sensor:
    - name: "Rain Expected Soon"
      unique_id: rain_expected_soon
      state: >
        {% set is_work = is_state('binary_sensor.workday_sensor', 'on') and 7 <= now().hour < 17 %}
        {% set ent = 'weather.om_work' if is_work else 'weather.om_home' %}
        {% set forecast = hourly[ent].forecast if hourly is defined and ent in hourly else [] %}
        {% set next_3 = forecast[:3] %}
        
        {% set precs = next_3 | map(attribute='precipitation') | select('defined') | list %}
        {% set probs = next_3 | map(attribute='precipitation_probability') | select('defined') | list %}
        
        {{ 'on' if (precs | select('gt', 0.05) | list | length > 0) or (probs | select('gt', 30) | list | length > 0) or is_state(ent, ['rainy', 'pouring']) else 'off' }}
      attributes:
        location_context: >
          {{ 'Work' if (is_state('binary_sensor.workday_sensor', 'on') and 7 <= now().hour < 17) else 'Home' }}
        max_probability: >
          {% set is_work = is_state('binary_sensor.workday_sensor', 'on') and 7 <= now().hour < 17 %}
          {% set ent = 'weather.om_work' if is_work else 'weather.om_home' %}
          {% set forecast = hourly[ent].forecast if hourly is defined and ent in hourly else [] %}
          {% set probs = forecast[:3] | map(attribute='precipitation_probability') | select('defined') | list %}
          {% if probs | length > 0 %}
            {{ probs | max }}
          {% else %}
            {% set precs = forecast[:3] | map(attribute='precipitation') | select('defined') | list %}
            {{ 100 if (precs | select('gt', 0.05) | list | length > 0) else 0 }}
          {% endif %}
        precip_type: rain
        raw_conditions: >
          {% set is_work = is_state('binary_sensor.workday_sensor', 'on') and 7 <= now().hour < 17 %}
          {% set ent = 'weather.om_work' if is_work else 'weather.om_home' %}
          {% set forecast = hourly[ent].forecast if hourly is defined and ent in hourly else [] %}
          {{ forecast[:3] | map(attribute='condition') | list }}
        start_time: >
          {% set is_work = is_state('binary_sensor.workday_sensor', 'on') and 7 <= now().hour < 17 %}
          {% set ent = 'weather.om_work' if is_work else 'weather.om_home' %}
          {% set forecast = hourly[ent].forecast if hourly is defined and ent in hourly else [] %}
          {% set rainy_hours = forecast | selectattr('precipitation', 'defined') | selectattr('precipitation', 'gt', 0.05) | list %}
          {{ (as_datetime(rainy_hours[0].datetime) | as_local).strftime('%I:%M %p') if rainy_hours and rainy_hours[0].datetime is defined else 'none' }}
